name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sora Weather APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK as direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sora-weather-${{ github.run_number }}
          name: Sora Weather build #${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
